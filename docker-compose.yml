version: '3'

services:

    static-web:
        image: nginx:alpine
        container_name: static-web
        volumes:
            - ./static:/usr/share/nginx/html
        environment:
            VIRTUAL_HOST: ${CLIENT_HOSTS}
            TZ: Europe/Moscow
            HTTPS_METHOD: nohttps
        expose:
            - "80"
        restart: always

    game-server:
        build: .
        user: "node"
        working_dir: /home/node/app/server
        container_name: game-server
        volumes:
            - ./serversrc:/home/node/app/server
            - ./static:/home/node/app/static
        environment:
            VIRTUAL_HOST: ${SERVER_HOST}
            TZ: Europe/Moscow
            HTTPS_METHOD: nohttps
            NODE_ENV: production
            MYSQL_HOST: game-db #${MYSQL_HOST}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        expose:
             - "3000"
        command: "nodemon server.js"
        restart: always

    game-db:
        image: mariadb:10.1
        expose:
            - "3306"
        ports:
            - "3336:3306"
        environment:
            MYSQL_ROOT_PASSWORD: 9B9TWa1sw29lF4cf
            MYSQL_DATABASE: games
            MYSQL_USER: games
            MYSQL_PASSWORD: BYYdHfX36W9yBFyM
        container_name: game-db
        volumes:
            - /srv/db-data/games:/var/lib/mysql
        restart: always


networks:
    default:
        external:
            name: nginxproxy_network