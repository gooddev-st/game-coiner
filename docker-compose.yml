version: '3'

services:

    game-server:
        build: .
        user: "node"
        working_dir: /home/node/app/server
        container_name: game-server
        volumes:
            - ./serversrc:/home/node/app/server
            - ./static:/home/node/app/public
        environment:
            VIRTUAL_HOST: games.q-dev.ru
            TZ: Europe/Moscow
            HTTPS_METHOD: nohttps
            NODE_ENV: production
            MYSQL_HOST: game-db
            MYSQL_DATABASE: games
            MYSQL_USER: games
            MYSQL_PASSWORD: BYYdHfX36W9yBFyM
        expose:
             - "3000"
        command: "nodemon server.js"
        restart: always

    game-db:
        image: mariadb:10.1
        expose:
            - "3306"
        ports:
            - "3326:3306"
        environment:
            MYSQL_ROOT_PASSWORD: 9B9TWa1sw29lF4cf
            MYSQL_DATABASE: games
            MYSQL_USER: games
            MYSQL_PASSWORD: BYYdHfX36W9yBFyM
        container_name: game-db
        volumes:
            - /srv/db-data/games:/var/lib/mysql
        restart: always


networks:
    default:
        external:
            name: nginxproxy_network