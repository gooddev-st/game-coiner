<html xmlns:v-on="http://www.w3.org/1999/xhtml">
<head>
    <title>Games</title>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <div class="menu">
        <h1 style="color: white">{{hello}}</h1>
    </div>
    <div class="menu start-menu" v-show="!active&&start_menu_need">
        <div class="label">Начнём?</div>
        <button @click="active=true,start_menu_need=false">СТАРТ</button>
    </div>
    <div class="menu pause-menu" v-show="!start_menu_need">
        <button @click="active=false" v-show="active">ПАУЗА</button>
        <button class="start" @click="active=true" v-show="!active&&!start_menu_need">СТАРТ</button>
    </div>
    <div ref="game_field" class="view-port">
        <field
                :active="active"
                v-on:click.capture="setSpotPosition">
            <single-spot
                :active="active"
                v-model="spotPosition"
            ></single-spot>
        </field>
    </div>
</div>
<script src="dist/build.js"></script>
</body>
</html>
