<script>

    /*
     * Управление панелькой логов
     * и видимостью заголовка игры
     **/

    var timer = null;
    var $game_title = $('.game-title');

    function resetTimeout(){

        if(timer) {
            clearTimeout(timer);
            timer = null;
        }

        if($game_title.is('.hidden')){
            timer = setTimeout(function () {
                $game_title.removeClass('hidden');
            }, 10000)

        }
    }
    $(function () {
        $('.logs-wrapper').on('mouseup', function (e) {
            $('body').toggleClass('consoled');
            return false;
        });

        $(document).keyup(function (e) {
            if (e.keyCode == 19 || e.keyCode == 192) {//Pause или тильда
                $('body').toggleClass('consoled');
            }
        });
        $(document).keydown(function (e) {
            $game_title.addClass('hidden');
            resetTimeout()
        });
        $(document).click(function (e) {
            $game_title.addClass('hidden');
            resetTimeout()
        });
        $(window).blur(function () {
            $game_title.removeClass('hidden');
            resetTimeout()
        })
    });
</script>
