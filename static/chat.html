<!DOCTYPE html>
<html class="chat-page-root" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0c">
    <link rel="stylesheet" href="css/style.css?v=0.25">
    <link rel="stylesheet" href="fonts/noto-emoji/noto-emoji.css?v=1">
    <link rel="stylesheet" href="css/chat.css?v=0.26">
    <title>Чат — Игра в монеты</title>
</head>
<body class="chat-page">

<!-- Отдельная страница чата для отладки: входит только в чат, персонаж в игре не появляется -->
<div id="chat-panel" class="chat-panel" style="display: none">
    <div id="chat-header" class="chat-header">
        <span class="chat-title">Чат</span>
        <span id="chat-unread" class="chat-unread"></span>
        <span id="chat-online" class="chat-online"></span>
        <button id="chat-signout" class="chat-signout" type="button">Выйти</button>
    </div>
    <div class="chat-body">
        <div id="chat-messages" class="chat-messages"></div>
        <div id="chat-emoji" class="chat-emoji" style="display: none"></div>
        <div id="chat-editing" class="chat-editing" style="display: none">
            Редактирование <button id="chat-edit-cancel" type="button" title="Отменить (Esc)">×</button>
        </div>
        <div class="chat-form">
            <button id="chat-emoji-button" class="chat-emoji-button" type="button" title="Смайлики">😀</button>
            <textarea id="chat-input" rows="2" placeholder="Сообщение. Enter — отправить, Shift+Enter — новая строка"></textarea>
            <button id="chat-send" class="chat-send" type="button" title="Отправить">➤</button>
        </div>
        <div id="chat-counter" class="chat-counter"></div>
    </div>
</div>

<div style="display: none"><div id="logs"></div></div>

<div id="loading" style="display: none"><div class="title">Подключение</div></div>

<div id="login-panel" class="login-panel" style="display: none"></div>
<div id="login-form" class="login-form" style="display: none">
    <div>
        <input id="login-input" type="text" placeholder="login" maxlength="20"><br>
        <input id="password-input" type="password" placeholder="password" maxlength="64">
        <button id="login-button">Войти</button>
        <div id="login-error" class="login-error"></div>
    </div>
</div>

<script src="config.js"></script>
<script src="js/chat.js?v=0.27"></script>
</body>
</html>
