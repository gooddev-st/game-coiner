# /etc/nginx/sites-available/game-coiner
server {
    listen 80;
    listen [::]:80;
    server_name game.good-dev.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.good-dev.tech;

    ssl_certificate     /etc/letsencrypt/live/game.good-dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.good-dev.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1d;

    root  /opt/game-coiner/static;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
